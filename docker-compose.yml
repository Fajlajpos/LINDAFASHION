# Produkční stack (VPS): web + worker + postgres + noční zálohy.
#
# Nasazuje se přes Coolify (dokumenty/nasazeni.md): to si soubor stáhne
# z GitHubu, sestaví a HTTPS vyřídí vlastní proxy.
#
# Bez Coolify, na holém serveru s vlastní Caddy jako reverzní proxy:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# `web` a `worker` sdílí jeden image a jednu kódovou základnu (sekce 3 zadání),
# liší se jen spouštěcím příkazem. Migrace se aplikují automaticky při startu `web`,
# aby nasazení nevyžadovalo ruční krok v databázi.

services:
  postgres:
    image: postgres:16-alpine
    container_name: linda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lindapassword}
      POSTGRES_DB: ${POSTGRES_DB:-linda_fashion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-linda} -d ${POSTGRES_DB:-linda_fashion}']
      interval: 5s
      timeout: 5s
      retries: 12
    # Databáze schválně NEpublikuje port ven – sahá na ni jen web a worker
    # přes interní docker síť.

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # `NEXT_PUBLIC_*` se vpéká do bundlu při buildu, ne za běhu – přes
      # `env_file` níž by se ke klientovi nikdy nedostalo. Hodnoty bere Compose
      # z `.env` vedle sebe, takže se nikde nedublují.
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        APP_URL: ${APP_URL:-}
    image: linda-fashion:latest
    container_name: linda_web
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node server.js"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linda}:${POSTGRES_PASSWORD:-lindapassword}@postgres:5432/${POSTGRES_DB:-linda_fashion}?schema=public
    # Ve výchozím nastavení jen na localhost. Caddy sahá na `web` po interní
    # síti Dockeru, takže mu to nevadí – a limity požadavků se opírají
    # o hlavičku `X-Forwarded-For`, kterou si při přímém přístupu zvenčí může
    # kdokoliv vymyslet a obejít tím brzdu na přihlašování.
    # Bez proxy nastav v `.env` `WEB_BIND=0.0.0.0` a počítej s tím.
    ports:
      - '${WEB_BIND:-127.0.0.1}:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
      - storage_data:/app/storage
      # Jen kvůli `stav.json`, ze kterého administrace pozná, že zálohy běží.
      # Ke čtení – web do záloh nikdy nezapisuje. Cesta musí být stejná jako
      # u služby `zalohy` níž, viz `ZALOHY_HOST_DIR`.
      - ${ZALOHY_HOST_DIR:-./zalohy}:/app/zalohy:ro
    # Zdravý `web` znamená "migrace doběhly a server odpovídá" – worker se na to
    # níž váže, aby nestartoval do databáze bez tabulek.
    healthcheck:
      # `/api/health` sáhne do databáze a při jejím výpadku vrátí 503.
      # Dřív se testovalo `/`, což je Server Component: bez databáze se
      # vyrenderovala chybová hranice a wget dostal obyčejnou 200. Kontejner
      # tak hlásil „healthy" s rozbitou databází a worker do ní nastartoval.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    # Stejný image jako web – nestaví se podruhé, jen se jinak spustí.
    # Build args musí být totožné s `web`: obě služby sdílejí jeden tag, takže
    # build s prázdnými argumenty by tomu předchozímu přepsal image bundlem
    # bez měřicích ID.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        APP_URL: ${APP_URL:-}
    image: linda-fashion:latest
    container_name: linda_worker
    restart: unless-stopped
    command: sh -c "node dist/worker/index.js"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linda}:${POSTGRES_PASSWORD:-lindapassword}@postgres:5432/${POSTGRES_DB:-linda_fashion}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      # Ne `service_started` – to čeká jen na spuštění kontejneru, ne na
      # dokončení `prisma migrate deploy`. Worker pak startoval do databáze
      # bez tabulek a padal na P2021, než ho restart politika zvedla.
      web:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
      - storage_data:/app/storage

  # Noční záloha databáze a souborů.
  #
  # Vlastní kontejner, ne úloha ve workeru: `pg_dump` musí být ve stejné verzi
  # jako server, a aplikační image (`node:20-alpine`) klienta Postgresu nemá.
  # Doinstalovat ho tam by nafouklo `web` i `worker`, protože sdílí jeden tag –
  # a ani jeden z nich `pg_dump` k ničemu nepotřebuje.
  #
  # Databáze schválně nepublikuje port, takže záloha musí běžet uvnitř téhle
  # sítě. Odtud `--network` a jméno hostitele `postgres`.
  zalohy:
    # `postgres:16-alpine` se skriptem uvnitř (deploy/zalohy.Dockerfile).
    # Verze tam MUSÍ sedět se službou `postgres` výš – `pg_dump` starší než
    # server odmítne dumpovat. Skript je zapečený, ne připojený z repozitáře:
    # Coolify soubory z repozitáře k běžícím kontejnerům nepřipojuje.
    build:
      context: ./deploy
      dockerfile: zalohy.Dockerfile
    image: linda-zalohy:latest
    container_name: linda_zalohy
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lindapassword}
      POSTGRES_DB: ${POSTGRES_DB:-linda_fashion}
      ZALOHY_DNU: ${ZALOHY_DNU:-30}
      ZALOHY_CAS: ${ZALOHY_CAS:-04:10}
    volumes:
      # Zdroje jen ke čtení – záloha nesmí mít jak poškodit to, co zálohuje.
      # Přípojné body kopírují rozložení aplikace v `/app`, aby v archivu byly
      # cesty `public/uploads/…` a `storage/faktury/…` a obnova se rozbalovala
      # rovnou na místo.
      - uploads_data:/zdroj/public/uploads:ro
      - storage_data:/zdroj/storage:ro
      # Výstup je bind mount, ne pojmenovaný volume: zálohy se musí dát ze
      # serveru odvézt jinam, a to je z volume zbytečná práce navíc.
      #
      # `ZALOHY_HOST_DIR` = pevná cesta na serveru. V Coolify je POVINNÁ
      # (`/data/linda/zalohy`): výchozí `./zalohy` by mířilo do složky, kterou
      # Coolify při nasazení přepisuje, a s ní by zmizely i zálohy.
      - ${ZALOHY_HOST_DIR:-./zalohy}:/zalohy
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '/zaloha.sh', '--smycka']

volumes:
  postgres_data:
  uploads_data: # hotové WebP varianty, servíruje je web
  storage_data: # dočasné originály čekající na zpracování workerem
